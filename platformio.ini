[platformio]
default_envs = esp32-mock

[env]
lib_deps = bblanchon/ArduinoJson@7.4.2
build_flags = -std=gnu++17 -I.
build_unflags = -std=gnu++11

[esp32]
; PROVISIONAL classic ESP32 target. Verify the actual module before flashing.
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.40900.250804
monitor_speed = 115200
build_src_filter = +<core/> +<firmware.cpp>

[env:esp32-mock]
extends = esp32
build_flags = ${env.build_flags} -DPFM_HARDWARE_OUTPUT=0

[env:esp32-hardware]
extends = esp32
build_flags = ${env.build_flags} -DPFM_HARDWARE_OUTPUT=1

[env:native]
platform = platformio/native@1.2.1
build_src_filter = +<core/> +<host.cpp>
build_flags = ${env.build_flags} -Wall -Wextra -Werror -g
